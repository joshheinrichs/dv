[package]
name = "dv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dv-eval = { version = "0.1.0", path = "../dv-eval" }
dv-store = { version = "0.1.0", path = "../dv-store" }
log = "0.4"
mimalloc = "0.1.52"
starlark = "0.14.2"

[features]
# count heap allocations and report them on exit (DV_PROFILE)
count-allocs = []
